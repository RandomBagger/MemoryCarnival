<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎪 Memory Carnival — Assets</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
</head>
<body class="admin-body">
  <header class="admin-header">
    <h1>🎪 Asset Booth</h1>
    <a class="btn btn-secondary btn-sm" href="/">← Back to game</a>
  </header>

  <div id="admin-status" class="admin-status"></div>

  <main id="admin-main" class="admin-main">
    <p class="admin-loading">Loading assets…</p>
  </main>

  <!-- Enlarged preview -->
  <div id="preview-modal" class="preview-modal hidden">
    <div class="preview-box">
      <button id="preview-close" class="preview-close" type="button" aria-label="Close">✕</button>
      <h3 id="preview-title"></h3>
      <div id="preview-body" class="preview-body"></div>
      <p class="preview-note">Shown on the same backdrop the game uses.</p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
